# GitHub Actions workflow.

name: CI

# # Run on push to a branch.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Jobs run in parallel, unless a job lists another one under `needs`.
jobs:
  # Check the code style without running the code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  # Run the tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run pytest tests/ -v

  # Train the model. Only runs when you press the `run workflow` button.
  train:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run python -m ci_cd.train
      # Keep the trained model, so you can download it from the run's page.
      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: model/
          retention-days: 30
