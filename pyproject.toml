[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ci_cd"
description = "Example project for the CI/CD module of the SDSC MLOps workshop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "numpy>=2.0",
    "requests>=2.32",
    "scikit-learn>=1.6",
    "uvicorn>=0.30",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "httpx2~=2.4",
    "pre-commit~=4.5",
    "pytest~=9.0",
    "ruff==0.17.2",
]

[tool.setuptools.dynamic]
version = {attr = "ci_cd.__version__"}
